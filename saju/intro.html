<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>연애사주 · 결제 전 소개 (3종 전체보기)</title>
<style>
:root{
  --bg:#fbf7f0;          /* 크림 종이 */
  --paper:#ffffff;       /* 카드 */
  --paper2:#faf6ff;      /* 옅은 보라 카드 */
  --ink:#33294a;         /* 본문 */
  --mut:#8a7fa3;         /* 흐린 글씨 */
  --line:#ece4f4;        /* 옅은 선 */
  --line2:#efe7dc;       /* 크림 선 */
  --pur:#8158e0;         /* 보라 = 브랜드 */
  --pur2:#a888f0;
  --pursoft:#f1ebfd;
  --gold:#dfa02a;
  --goldsoft:#fbefcf;
  --red:#e8607e;
  --redsoft:#fde7ec;
  --grn:#2fa877;
  --grnsoft:#e0f5ec;
  --blu:#4a90d9;
}
*{box-sizing:border-box;margin:0}
body{background:#e7e0d3;font-family:'Pretendard',-apple-system,'Malgun Gothic',sans-serif;color:var(--ink);padding:16px 8px 60px;display:flex;flex-direction:column;align-items:center;line-height:1.62;-webkit-font-smoothing:antialiased}
.phone{width:min(460px,100%);background:var(--bg);border-radius:28px;overflow:hidden;box-shadow:0 18px 55px rgba(80,60,120,.22);position:relative}

/* 탭 */
.tabs{display:flex;position:sticky;top:0;z-index:20;background:#fbf7f0f2;backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:none;color:var(--mut);font-family:inherit;font-weight:800;font-size:12.5px;padding:15px 4px;cursor:pointer;border-bottom:2.5px solid transparent;transition:.15s}
.tabs button.on{color:var(--pur);border-bottom-color:var(--pur)}

/* 히어로 */
.hero{background:linear-gradient(180deg,#efe7fc 0%,#f7f0ff 55%,var(--bg) 100%);padding:28px 22px 24px;text-align:center;position:relative}
.hero .author{display:inline-block;font-size:12px;color:var(--pur);font-weight:800;background:#fff;border:1px solid var(--line);border-radius:99px;padding:5px 13px;margin-bottom:12px;box-shadow:0 2px 8px rgba(129,88,224,.08)}
.hero h1{font-size:24px;line-height:1.34;letter-spacing:-.5px;color:#2c2144}
.hero .sub{font-size:13px;color:#6b6086;margin-top:10px;line-height:1.55}
.stats{display:flex;margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 0;box-shadow:0 4px 14px rgba(129,88,224,.06)}
.stats div{flex:1;font-size:11px;color:var(--mut);border-right:1px solid var(--line)}
.stats div:last-child{border:none}
.stats b{display:block;font-size:16px;color:var(--ink);margin-bottom:3px}
.stats b.gold{color:var(--gold)}

/* 섹션 */
.sec{padding:22px 20px 2px}
.secnum{display:inline-flex;align-items:center;gap:8px;margin-bottom:10px}
.secnum .n{width:28px;height:28px;border-radius:9px;background:var(--pur);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:14px}
.secnum .t{font-size:11px;font-weight:800;color:var(--pur);letter-spacing:.4px}
.sec h2{font-size:19px;letter-spacing:-.3px;margin-bottom:5px;color:#2c2144}
.sec .sd{font-size:13px;color:#6b6086;margin-bottom:14px;line-height:1.55}

/* 체크 티저 */
.teaser{background:var(--paper2);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:16px 20px 0}
.teaser .q{font-size:13.5px;color:#5a4c86;padding:5px 0;display:flex;gap:8px;align-items:flex-start}
.teaser .q b{color:var(--pur);flex:none}
.teaser .big{font-size:15.5px;font-weight:800;color:#b47d12;background:var(--goldsoft);border-radius:11px;padding:11px 13px;margin-top:12px;line-height:1.5}
.chk{display:flex;gap:9px;align-items:flex-start;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:9px;font-size:14px}
.chk .i{color:var(--pur);font-weight:900;flex:none}

/* 개념 카드 (뜻풀이) */
.concept{display:flex;gap:10px;margin-bottom:6px}
.concept .cc{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.concept .cc .em{font-size:26px}
.concept .cc .tt{font-size:14px;font-weight:900;margin:6px 0 4px}
.concept .cc .ds{font-size:12px;color:var(--mut);line-height:1.5}
.concept .cc.pur{border-color:#e3d7fb;background:var(--paper2)}
.concept .cc.red{border-color:#f6d6de;background:var(--redsoft)}
.concept .cc.pur .tt{color:var(--pur)}
.concept .cc.red .tt{color:var(--red)}

/* 게이지 (가로 막대) */
.gwrap{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px 17px;margin-bottom:12px;box-shadow:0 4px 14px rgba(129,88,224,.05)}
.gwrap .gh{font-size:14px;font-weight:900;margin-bottom:14px;color:#2c2144}
.gauge{margin:12px 0}
.gauge .gl{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:6px}
.gauge .gl .nm{font-weight:800;color:#4a3f66}
.gauge .gl .gv{font-weight:900;font-size:15px}
.gtrack{height:11px;background:#f0ecf6;border-radius:99px;overflow:hidden}
.gfill{height:100%;border-radius:99px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.gauge .cap{font-size:11.5px;color:var(--mut);margin-top:6px}
.t-pur .gfill,.gfill.t-pur{background:linear-gradient(90deg,var(--pur),var(--pur2))}
.t-gold .gfill,.gfill.t-gold{background:linear-gradient(90deg,#e6a52d,#f4c95d)}
.t-red .gfill,.gfill.t-red{background:linear-gradient(90deg,#e8607e,#f28fa4)}
.t-grn .gfill,.gfill.t-grn{background:linear-gradient(90deg,#2fa877,#5fd3a0)}
.t-blu .gfill,.gfill.t-blu{background:linear-gradient(90deg,#4a90d9,#7cb5ec)}

/* 원형 게이지 (종합 점수) */
.ringwrap{display:flex;gap:15px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px 17px;margin-bottom:12px;box-shadow:0 5px 18px rgba(129,88,224,.07)}
.ring{width:104px;height:104px;flex:none;border-radius:50%;display:grid;place-items:center}
.ring i{width:78px;height:78px;background:var(--paper);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .rn{font-size:27px;font-weight:900;line-height:1}
.ring .ru{font-size:10.5px;color:var(--mut);margin-top:3px}
.ringwrap .rx .rq{font-size:14.5px;font-weight:900;color:#2c2144;line-height:1.4;margin-bottom:5px}
.ringwrap .rx .rd{font-size:12.5px;color:#6b6086;line-height:1.5}

/* 오행 막대 */
.elem{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px 17px;margin-bottom:12px}
.elem .eh{font-size:14px;font-weight:900;margin-bottom:4px}
.elem .ec{font-size:12px;color:var(--mut);margin-bottom:14px;line-height:1.5}
.ebars{display:flex;align-items:flex-end;gap:9px;height:96px}
.ebars .eb{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.ebars .bar{width:64%;border-radius:7px 7px 0 0;min-height:5px;transition:height .9s cubic-bezier(.2,.8,.2,1)}
.ebars .ev{font-size:11px;font-weight:900;margin-bottom:4px;color:#4a3f66}
.ebars .el{font-size:12px;margin-top:7px;font-weight:800}
. e-목 .bar{background:linear-gradient(180deg,#7fd3a0,#3fa877)} .e-목 .el{color:#2e9e6c}
.e-화 .bar{background:linear-gradient(180deg,#f28fa4,#e8607e)} .e-화 .el{color:#e05a72}
.e-토 .bar{background:linear-gradient(180deg,#f4c95d,#e0a52a)} .e-토 .el{color:#c68a15}
.e-금 .bar{background:linear-gradient(180deg,#cfc9d8,#9a92ad)} .e-금 .el{color:#8a819c}
.e-수 .bar{background:linear-gradient(180deg,#7cb5ec,#4a90d9)} .e-수 .el{color:#3f82cf}

/* 타임라인 */
.tl{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px 15px 14px;margin-bottom:12px}
.tl .th{font-size:14px;font-weight:900;margin-bottom:4px}
.tl .tc{font-size:12px;color:var(--mut);margin-bottom:16px;line-height:1.5}
.tlrail{position:relative;padding-top:2px}
.tlrail .rail{position:absolute;left:5%;right:5%;top:21px;height:3px;background:#eee6f6;border-radius:2px}
.tlrail .pts{display:flex;position:relative}
.tlrail .pt{flex:1;text-align:center;position:relative}
.tlrail .wh{font-size:10.5px;color:var(--mut);height:16px}
.tlrail .dot{width:15px;height:15px;border-radius:50%;background:#cdc3e6;margin:0 auto;border:3px solid #fff;box-shadow:0 0 0 1px #ddd2f0}
.tlrail .lb{font-size:11px;font-weight:800;margin-top:7px;color:#5a4f74;line-height:1.35}
.tlrail .pt.hot .dot{background:var(--gold);box-shadow:0 0 0 5px #f8e7b8}
.tlrail .pt.hot .wh{color:#b9791a;font-weight:800}
.tlrail .pt.hot .lb{color:#b9791a}

/* 막대그래프 (관계·반응) */
.bc{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px 15px 12px;margin-bottom:12px}
.bc .bh{font-size:14px;font-weight:900;margin-bottom:2px}
.bc .bcc{font-size:12px;color:var(--mut);margin-bottom:14px}
.bcbars{display:flex;align-items:flex-end;gap:11px;height:118px}
.bcbars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.bcbars .bar{width:74%;border-radius:8px 8px 0 0;min-height:6px;background:linear-gradient(180deg,var(--pur2),var(--pur));transition:height .9s cubic-bezier(.2,.8,.2,1)}
.bcbars .bar.gold{background:linear-gradient(180deg,#f4c95d,#e0a52a)}
.bcbars .bv{font-size:11.5px;font-weight:900;margin-bottom:5px;color:#4a3f66}
.bcbars .bl{font-size:11px;color:var(--mut);margin-top:7px;text-align:center;line-height:1.3}

/* 프로필 비교 */
.prof{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:15px 16px;margin-bottom:11px}
.prof .ph{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.prof .ph .em{font-size:20px}
.prof .ph .nm{font-size:15px;font-weight:900}
.prof.pur{border-color:#e3d7fb} .prof.pur .nm{color:var(--pur)}
.prof.red{border-color:#f6d6de} .prof.red .nm{color:var(--red)}
.prof .match{display:flex;align-items:center;gap:8px;margin:6px 0 12px}
.prof .match .mt{flex:1;height:9px;background:#f0ecf6;border-radius:99px;overflow:hidden}
.prof .match .mf{height:100%;border-radius:99px}
.prof.pur .match .mf{background:linear-gradient(90deg,var(--pur),var(--pur2))}
.prof.red .match .mf{background:linear-gradient(90deg,var(--red),#f28fa4)}
.prof .match .mv{font-size:12px;font-weight:900;flex:none}
.prof.pur .match .mv{color:var(--pur)} .prof.red .match .mv{color:var(--red)}

/* 카드 kv */
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:11px}
.card .ct{font-size:14.5px;font-weight:900;color:var(--pur);margin-bottom:9px}
.card.red .ct{color:var(--red)}
.kv{font-size:13.5px;padding:5px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border:none}
.kv b{color:var(--mut);font-weight:700;display:inline-block;min-width:80px}

/* 말풍선 */
.talk{background:var(--pursoft);color:#4a3d78;border-radius:14px;padding:12px 15px;font-size:13.5px;font-weight:600;margin-bottom:10px;line-height:1.55}
.talk.q{background:#f4f0ea;color:#5a5140}

/* 4단계 진단 */
.diag{background:var(--paper);border:1.5px solid #e3d7fb;border-radius:16px;padding:15px 16px;margin-bottom:12px}
.diag .stg{display:inline-block;background:var(--pur);color:#fff;font-size:11px;font-weight:900;padding:4px 13px;border-radius:99px;margin-bottom:11px}
.diag .row{font-size:13px;padding:7px 0;border-bottom:1px dashed var(--line);display:flex;justify-content:space-between;gap:8px}
.diag .row:last-of-type{border:none}
.diag .row .tag{font-size:12px;font-weight:800;flex:none;color:var(--grn)}
.diag .pct{margin-top:12px}
.diag .pct .pl{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.diag .pct .pl .n{font-size:13px;font-weight:800;color:#4a3f66}
.diag .pct .pl .v{font-size:20px;font-weight:900;color:var(--pur)}
.diag .pct .gtrack{height:10px}
.diag .pct .q{font-size:13px;color:#b47d12;font-weight:800;margin:9px 0 3px}
.diag .pct .d{font-size:12.5px;color:#6b6086;line-height:1.5}

/* best/worst */
.sc{border-radius:12px;padding:12px 14px;margin-bottom:9px;font-size:13.5px;display:flex;gap:9px;align-items:flex-start}
.sc.best{background:var(--grnsoft);border:1px solid #bce6d3}
.sc.worst{background:var(--redsoft);border:1px solid #f4cdd6}
.sc .lb{font-weight:900;flex:none;font-size:11px;padding:2px 8px;border-radius:6px}
.sc.best .lb{color:#fff;background:var(--grn)}
.sc.worst .lb{color:#fff;background:var(--red)}

.note-b{background:var(--goldsoft);border:1px solid #f0dca0;border-radius:12px;padding:13px 15px;text-align:center;font-size:13.5px;margin:6px 0 12px;color:#8a6512;line-height:1.55}
.note-b b{color:#b47d12}
.divider{text-align:center;color:var(--mut);font-size:13px;padding:18px 20px 4px}
.divider b{color:var(--pur);font-size:16px;display:block;margin-top:6px}

.cta-wrap{position:sticky;bottom:0;background:#fbf7f0f2;backdrop-filter:blur(8px);padding:14px 18px;border-top:1px solid var(--line)}
.cta{display:block;width:100%;background:linear-gradient(135deg,#8158e0,#a179f0);color:#fff;border:none;border-radius:15px;padding:16px;font-size:16px;font-weight:900;font-family:inherit;cursor:pointer;text-align:center;box-shadow:0 8px 22px rgba(129,88,224,.32)}
.cta small{display:block;font-weight:700;font-size:11.5px;color:#f0e8ff;margin-top:3px}
.pricebar{text-align:center;font-size:12px;color:var(--mut);padding:12px}
</style>

/* ───────── 렌더 ───────── */
const RC={ 't-pur':'#8158e0','t-gold':'#e0a52a','t-red':'#e8607e','t-grn':'#2fa877','t-blu':'#4a90d9' };
const EMAX=5;
const tabsEl=document.getElementById('tabs'), wrapEl=document.getElementById('wrap');
tabsEl.innerHTML=REPORTS.map((r,i)=>`<button class="${i===0?'on':''}" onclick="showRep(${i})">${r.tab}</button>`).join('');
let CUR=REPORTS[0];

function gauge([nm,pct,tone,cap]){
  return `<div class="gauge ${tone}"><div class="gl"><span class="nm">${nm}</span><span class="gv" style="color:${RC[tone]}">${pct}%</span></div>
  <div class="gtrack"><div class="gfill ${tone}" style="width:${pct}%"></div></div>${cap?`<div class="cap">${cap}</div>`:''}</div>`;
}
function ring(b){
  const [pct,label,sub,tone]=b.ring, c=RC[tone];
  return `<div class="ringwrap"><div class="ring" style="background:conic-gradient(${c} ${pct*3.6}deg,#efe7f4 0)">
    <i><span class="rn" style="color:${c}">${pct}%</span><span class="ru">${label}</span></i></div>
    <div class="rx"><div class="rd" style="color:${c};font-weight:800;font-size:11px;margin-bottom:6px">${sub}</div>
    <div class="rq">${b.rq}</div><div class="rd">${b.rd}</div></div></div>`;
}
function elemBlock(b){
  return `<div class="elem"><div class="eh">${b.etitle}</div><div class="ec">${b.ecap}</div>
   <div class="ebars">${b.elem.map(([n,c])=>`<div class="eb e-${n}"><span class="ev">${c}</span>
     <div class="bar" style="height:${Math.round(c/EMAX*100)}%"></div><span class="el">${n}</span></div>`).join('')}</div></div>`;
}
function timeline(t){
  return `<div class="tl"><div class="th">${t.title}</div><div class="tc">${t.cap}</div>
   <div class="tlrail"><div class="rail"></div><div class="pts">${t.points.map(([lb,wh,hot])=>
     `<div class="pt ${hot?'hot':''}"><div class="wh">${wh}</div><div class="dot"></div><div class="lb">${lb}</div></div>`).join('')}</div></div></div>`;
}
function profiles(list){
  return list.map(([em,title,tone,match,rows])=>`<div class="prof ${tone}">
    <div class="ph"><span class="em">${em}</span><span class="nm">${title}</span></div>
    <div class="match"><span class="mt"><span class="mf" style="width:${match}%"></span></span><span class="mv">나와 ${match}%</span></div>
    ${rows.map(([k,v])=>`<div class="kv"><b>${k}</b> ${v}</div>`).join('')}</div>`).join('');
}
function concept(list){
  return `<div class="concept">${list.map(([em,tt,_,ds],i)=>`<div class="cc ${i===0?'red':'pur'}">
    <div class="em">${em}</div><div class="tt">${tt}</div><div class="ds">${ds}</div></div>`).join('')}</div>`;
}

function renderBlock(b){
  let h='';
  if(b.t==='chks'){ h+=`<div style="padding:0 20px">`+CUR.teaser.lines.map(l=>`<div class="chk"><span class="i">✓</span>${l}</div>`).join('')+`</div>`; }
  if(b.t==='talks'){ h+=`<div class="sec">`+b.items.map(([k,v])=>`<div class="talk ${k}">${v}</div>`).join('')+`</div>`; }
  if(b.ring){ h+=`<div class="sec" style="padding-top:6px">`+ring(b)+`</div>`; }
  if(b.gauges){ h+=`<div class="sec" style="padding-top:6px"><div class="gwrap"><div class="gh">${b.gtitle}</div>`+b.gauges.map(gauge).join('')+`</div></div>`; }
  if(b.elem){ h+=`<div class="sec" style="padding-top:6px">`+elemBlock(b)+`</div>`; }
  if(b.timeline){ h+=`<div class="sec" style="padding-top:6px">`+timeline(b.timeline)+`</div>`; }
  if(b.divider){ h+=`<div class="divider">${b.divider[0]}<b>${b.divider[1]}</b></div>`; }
  if(b.sec!=null){
    h+=`<div class="sec"><div class="secnum"><span class="n">${b.sec}</span>${b.tag?`<span class="t">${b.tag}</span>`:''}</div><h2>${b.h}</h2>${b.sd?`<div class="sd">${b.sd}</div>`:''}`;
    if(b.concept) h+=concept(b.concept);
    if(b.talk) h+=`<div class="talk ${b.talk[0]}">${b.talk[1]}</div>`;
    if(b.profiles) h+=profiles(b.profiles);
    if(b.cards) h+=b.cards.map(([ct,kvs],i)=>`<div class="card ${i===1&&CUR.id==='reunion'?'red':''}"><div class="ct">${ct}</div>${kvs.map(([k,v])=>`<div class="kv"><b>${k}</b> ${v}</div>`).join('')}</div>`).join('');
    if(b.talks) h+=b.talks.map(([k,v])=>`<div class="talk ${k}">${v}</div>`).join('');
    if(b.diags) h+=b.diags.map(([stg,rows,pct,q,d])=>`<div class="diag"><span class="stg">${stg}</span>${rows.map(([r,tag])=>`<div class="row"><span>${r}</span>${tag?`<span class="tag">${tag}</span>`:''}</div>`).join('')}<div class="pct"><div class="pl"><span class="n">재회 가능성</span><span class="v">${pct}%</span></div><div class="gtrack"><div class="gfill t-pur" style="width:${pct}%"></div></div><div class="q">"${q}"</div><div class="d">${d}</div></div></div>`).join('');
    if(b.scen) h+=b.scen.map(([k,v])=>`<div class="sc ${k}"><span class="lb">${k==='best'?'BEST':'WORST'}</span><span>${v}</span></div>`).join('');
    if(b.note) h+=`<div class="note-b">${b.note}</div>`;
    h+=`</div>`;
  }
  if(b.note && b.sec==null){ h+=`<div class="sec" style="padding-top:6px"><div class="note-b">${b.note}</div></div>`; }
  if(b.final){ const c=RC['t-gold'];
    h+=`<div class="sec" style="padding-top:6px"><div class="ringwrap" style="border-color:#f0dca0;background:var(--goldsoft)">
     <div class="ring" style="background:conic-gradient(${c} ${b.final[0]*3.6}deg,#f3e6c4 0)"><i style="background:var(--goldsoft)"><span class="rn" style="color:${c}">${b.final[0]}%</span><span class="ru">최종 결론</span></i></div>
     <div class="rx"><div class="rq" style="color:#8a6512">${b.final[1]}</div><div class="rd" style="color:#8a6512">${b.final[2]}</div></div></div></div>`; }
  return h;
}
function showRep(i){
  CUR=REPORTS[i];
  [...tabsEl.children].forEach((b,j)=>b.classList.toggle('on',j===i));
  const r=CUR;
  let h=`<div class="hero"><div class="author">🔮 ${r.author}</div><h1>${r.title}</h1><div class="sub">${r.sub}</div>
    <div class="stats">${r.stats.map(([k,v])=>`<div><b class="${v.includes('건')||v.includes('타이밍')?'gold':''}">${v}</b>${k}</div>`).join('')}</div></div>`;
  h+=`<div class="teaser">${r.teaser.lines.map(l=>`<div class="q"><b>✓</b>${l}</div>`).join('')}<div class="big">${r.teaser.big}</div></div>`;
  h+=r.blocks.map(renderBlock).join('');
  h+=`<div class="pricebar">이 소개는 결제 전 전체 미리보기예요 · 가격 ${r.price}</div>`;
  wrapEl.innerHTML=h;
  document.getElementById('cta-price').textContent=r.price;
  // 게이지 채우기 애니메이션
  requestAnimationFrame(()=>{ wrapEl.querySelectorAll('.gfill,.mf,.ebars .bar').forEach(el=>{const w=el.style.width,ht=el.style.height; if(w){el.style.width='0';requestAnimationFrame(()=>el.style.width=w);} if(ht){el.style.height='0';requestAnimationFrame(()=>el.style.height=ht);} }); });
}
/* 홈에서 넘어올 때 #reunion / #lifelong / #love2marry 로 해당 탭을 바로 연다 */
function openFromHash(){
  const id=(location.hash||'').replace('#','');
  const i=REPORTS.findIndex(r=>r.id===id);
  showRep(i>=0?i:0);
}
window.addEventListener('hashchange',openFromHash);
